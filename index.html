<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <!-- Google exige que el favicon sea cuadrado y de al menos 48x48 para mostrarlo
         en los resultados de búsqueda; si no, dibuja el globo genérico. El anterior
         era un JPEG de 1024x1024 renombrado .png que traía la cuadrícula de
         transparencia quemada como píxeles grises, y el .svg ni siquiera era de
         Movinex (venía de una plantilla). Todos se regeneran desde la "M" de
         src/assets/movinex_color.svg. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover: sin esto, env(safe-area-inset-*) queda siempre en 0 y no hay
         forma de darle al botón flotante de WhatsApp ni al último botón de cada paso el
         margen necesario para no quedar tapados por la barra/home indicator del iPhone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Google Sans Flex: solo para títulos/headings (ver Landing.module.css), el
         resto del texto sigue en Inter. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..800&display=swap"
      rel="stylesheet"
    />

    <!-- title, meta description y canonical: renderizados por página desde
         Landing.tsx y Cotizador.tsx (React 19 los hoistea a <head>). No se
         declaran aquí como estáticos porque, al ser una SPA con un solo
         index.html para todas las rutas, coexistirían con la versión dinámica
         y quedarían duplicados — confundiendo a Google sobre cuál
         title/description/canonical usar (bug real encontrado 16 ago 2026:
         el <title> estático viejo aparecía duplicado junto al de React). -->
    <meta name="robots" content="index, follow" />
    <meta name="google-site-verification" content="pygj2VzidJaIP3jDJcsoxZ7uAhpBvGz6UJ3bRaMCZtM" />
    <meta name="theme-color" content="#0B1B3A" />
    <meta name="author" content="NVX Technologies, S. de R.L. de C.V." />

    <!-- Open Graph: define cómo se ve el link al compartirlo por WhatsApp, que es el
         canal principal con los clientes (links de pago, de retomar la solicitud, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Movinex" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:url" content="https://www.movinex.mx/" />
    <meta property="og:title" content="Movinex | Celulares a pagos semanales sin buró ni tarjeta" />
    <meta
      property="og:description"
      content="Estrena celular pagando semanalmente, sin checar buró, sin tarjeta y sin aval. Solo tu INE y WhatsApp: aprobación en minutos y envío a todo México."
    />
    <meta property="og:image" content="https://www.movinex.mx/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Movinex — el celular que necesitas, a tu ritmo" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Movinex | Celulares a pagos semanales sin buró ni tarjeta" />
    <meta
      name="twitter:description"
      content="Estrena celular pagando semanalmente, sin checar buró, sin tarjeta y sin aval. Aprobación en minutos y envío a todo México."
    />
    <meta name="twitter:image" content="https://www.movinex.mx/og-image.png" />

    <!-- Datos estructurados: ayudan a Google a mostrar el negocio como tal (nombre,
         logo, redes, contacto) en vez de solo un resultado de texto. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Movinex",
        "legalName": "NVX TECHNOLOGIES, S. DE R.L. DE C.V.",
        "url": "https://www.movinex.mx/",
        "logo": "https://www.movinex.mx/logo.png",
        "image": "https://www.movinex.mx/og-image.png",
        "description": "Financiamiento de celulares en México con pagos semanales, sin buró de crédito, sin tarjeta y sin aval.",
        "areaServed": {
          "@type": "Country",
          "name": "México"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+52-55-5502-8744",
          "contactType": "customer service",
          "areaServed": "MX",
          "availableLanguage": ["es"]
        },
        "sameAs": [
          "https://www.facebook.com/Movinex",
          "https://www.instagram.com/movinex.mx"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
